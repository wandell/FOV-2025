project:
  type: book

book:
  title: "Foundations of Vision (2nd Edition)"
  author: "Brian Wandell"
  date: "10/26/2024"
  chapters:
    - index.qmd
    - part: "Image Encoding"
      chapters:
       - chapters/part-encoding.qmd
       - chapters/image-formation.qmd
       - chapters/photoreceptors.qmd
       - chapters/wavelength-encoding.qmd
       - chapters/eye-movements.qmd
    - part:  "Image Representation"
      chapters:
      - chapters/part-representation.qmd
      - chapters/retina.qmd
      - chapters/cortex.qmd
      - chapters/cortex-mri.qmd
      - chapters/plasticity.qmd
      - chapters/pattern-sensitivity.qmd
      - chapters/multiresolution.qmd
    - part: "Image Interpretation"
      chapters:
       - chapters/part-interpretation.qmd
       - chapters/color.qmd
       - chapters/motion-depth.qmd
       - chapters/seeing.qmd
    - references.qmd
    - part: "Appendix"
      chapters:
       - chapters/appendix-math.qmd
       - chapters/appendix-mri.qmd
       - chapters/appendix-simulations.qmd
       - chapters/appendix-adaptive-optics.qmd
       - chapters/appendix-calculations.qmd
       - chapters/appendix-teaching-resources.qmd

bibliography:
  - paperpile.bib
  - local.bib

crossref:
  chapters: true
  fig-prefix: "Figure"
  tbl-prefix: "Table"
  sec-prefix: "Section"
  
#  I am unsure about these formatting commands for the document.  Experimental.
format:
  html:
    toc: true
    layout: sidebar
    number-sections: true
    theme: cosmo   # flatly, yeti, sandstone, minty, cerulean, default
    fig-cap-location: margin
    render-on-save: true
    mathjax: "local"
    math: 
      number-sections: true
      number-equations: true
  pdf:
    documentclass: scrreprt
    toc: true
    toc-title: "Contents"
    toc-number-sections: true
    toc-number-depth: 2
    fig-caption: true
    number-sections: true
    number-depth: 2
    keep-tex: false
    latex-clean: true
    math:
      number-equations: true





