# Check the book on every push to main (and on pull requests).
# This workflow does NOT publish; run `quarto publish gh-pages` locally
# when a set of updates is ready to go live.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allows a manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check citations resolve
        run: python3 scripts/check_citations.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.25"

      - name: Render book (HTML only; PDF is built locally)
        run: quarto render --to html

      - name: Check internal links
        run: python3 scripts/check_internal_links.py _book
