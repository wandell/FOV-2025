# Render the book (HTML only) and publish it to the gh-pages branch
# on every push to main. Build the PDF locally when you want it.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows a manual run from the Actions tab

permissions:
  contents: write      # needed to push the gh-pages branch

concurrency:
  group: publish-gh-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.25

      - name: Create gh-pages branch if it does not exist yet
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch --orphan gh-pages
            git commit --allow-empty -m "Initialize gh-pages"
            git push origin gh-pages
            git switch main
          fi

      - name: Render book (HTML)
        run: quarto render --to html

      - name: Publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
